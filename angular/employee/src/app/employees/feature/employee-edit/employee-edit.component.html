<div class="card">
  <form
    class="employee-form"
    [formGroup]="employeeFormGroup"
    (ngSubmit)="submit()"
  >
    <div class="custom-row">
      <div class="custom-column">
        <input
          formControlName="name"
          pInputText
          placeholder="Name of employee"
        />
        @if(isInvalid('name')) {
        <app-validation-messages
          [control]="employeeFormGroup.controls['name']"
          [messages]="{required: 'Name is required!',
      minlength: 'Name must be longer than 5 characters!',
      maxlength: 'Name must be shorter than 25 characters!'}"
        />
        }
      </div>
      <div class="custom-column">
        <input
          formControlName="surname"
          pInputText
          placeholder="Surname of employee"
        />
        @if(isInvalid('surname')) {
        <app-validation-messages
          [control]="employeeFormGroup.controls['surname']"
          [messages]="{required: 'Surname is required!',
      minlength: 'Surname must be longer than 5 characters!',
      maxlength: 'Surname must be shorter than 25 characters!'}"
        />
        }
      </div>
    </div>
    <div class="custom-row">
      <div class="custom-column">
        <input
          pInputText
          formControlName="email"
          placeholder="Email of employee"
        />
        @if(isInvalid('email')) {
        <app-validation-messages
          [control]="employeeFormGroup.controls['email']"
          [messages]="{required: 'Email address is required!',
    email: 'Email address is not valid!',
    maxlength: 'Email address must be shorter than 50 characters!'}"
        />
        }
      </div>
    </div>
    @if (viewModel(); as vm) {
    <div>
      <div class="custom-row">
        <div class="custom-column">
          <p-select
            [disabled]="disable"
            [virtualScroll]="true"
            appendTo="body"
            formControlName="department"
            [options]="vm.departments"
            optionLabel="name"
            placeholder="Select a Department"
            dataKey="id"
          />
        </div>
        <div class="custom-column">
          <p-multiSelect
            [disabled]="disable"
            appendTo="body"
            [options]="vm.skills"
            formControlName="skills"
            optionLabel="name"
            placeholder="Select Skills"
          />
        </div>
      </div>
      @if(vm.loading) {
      <div class="card flex justify-center progress-spinner">
        <p-progress-spinner ariaLabel="loading" />
      </div>
      }
    </div>
    }
    <div class="action-buttons">
      <p-button severity="danger" label="Cancel" (onClick)="cancel()" />
      @if(!disable) {
      <p-button
        severity="success"
        [disabled]="employeeFormGroup.invalid"
        label="Submit"
        type="submit"
      />
      }
    </div>
  </form>
</div>
