<div class="card">
  <form class="skill-form" [formGroup]="skillFormGroup" (ngSubmit)="submit()">
    <input
      [readonly]="disable"
      formControlName="name"
      pInputText
      [placeholder]="namePlaceholder"
    />
    @if (isInvalid('name')) {
    <app-validation-messages
      [control]="skillFormGroup.controls['name']"
      [messages]="{
        required: requiredTranslation('COMMON.NAME'),
        minlength: minLengthTranslation('COMMON.NAME', 5),
        maxlength: maxLengthTranslation('COMMON.NAME', 25)
      }"
    />
    }
    <input
      [readonly]="disable"
      formControlName="description"
      pInputText
      [placeholder]="descriptionPlaceholder"
    />
    @if (isInvalid('description')) {
    <app-validation-messages
      [control]="skillFormGroup.controls['description']"
      [messages]="{
        required: requiredTranslation('COMMON.DESCRIPTION'),
        minlength: minLengthTranslation('COMMON.DESCRIPTION', 5),
        maxlength: maxLengthTranslation('COMMON.DESCRIPTION', 25)
      }"
    />
    } @if (viewModel(); as vm) { @if(vm.loading) {
    <div class="card flex justify-center progress-spinner">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    } }
    <div class="action-buttons">
      <p-button severity="danger" [label]="cancelLabel" (onClick)="cancel()" />
      @if(!disable) {
      <p-button
        severity="success"
        [disabled]="skillFormGroup.invalid"
        [label]="submitLabel"
        type="submit"
      />
      }
    </div>
  </form>
</div>
