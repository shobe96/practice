@if(viewModel(); as vm) {
<div class="card">
  <app-search-filter-wrapper
    [formGroup]="userFormGroup"
    (clear)="clear()"
    (refresh)="refresh()"
  >
    <input formControlName="username" pInputText [placeholder]="ussernameSearch()" />
  </app-search-filter-wrapper>
  @if(vm.data.length) {
  <p-table
    [rowHover]="true"
    [value]="vm.data"
    [tableStyle]="{ 'min-width': '70rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th id="id">{{ 'COMMON.ID' | translate}}</th>
        <th id="username">{{ 'AUTH.LOGIN.USERNAME' | translate}}</th>
        <th id="actions">{{ 'COMMON.ACTIONS' | translate}}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>
          @for(btn of actionButtons(); track $index) {
          <app-icon-button
            [icon]="btn.icon"
            (action)="btn.action(user)"
            [severity]="btn.severity"
            [tooltipPosition]="'top'"
            [tooltip]="btn.tooltip"
          />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="card flex justify-content-center">
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="vm.page.first"
      [rows]="vm.page.size"
      [totalRecords]="vm.page.pageCount"
      [rowsPerPageOptions]="vm.rowsPerPage"
    ></p-paginator>
  </div>
  } @else {
  <p>
    No results.
  </p>
  }
  <div>
    @if(vm.loading) {
    <div class="card flex justify-center progress-spinner">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    }
  </div>
</div>
}
