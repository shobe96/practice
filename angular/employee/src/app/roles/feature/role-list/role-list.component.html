@if(viewModel(); as vm) {
<div class="card">
  <app-search-filter-wrapper
    [formGroup]="roleFormGroup"
    (clear)="clear()"
    (refresh)="refresh()"
  >
    <input formControlName="name" pInputText placeholder="Name of employee" />
  </app-search-filter-wrapper>

  <p-button label="Add New" (onClick)="addNew()" />
  @if(vm.data.length) {
  <p-table
    [rowHover]="true"
    [value]="vm.data"
    [tableStyle]="{ 'min-width': '70rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th id="role_id">ID</th>
        <th id="role_name">Name</th>
        <th id="role_actions">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-role>
      <tr>
        <td>{{ role.id }}</td>
        <td>{{ role.name }}</td>
        <td>
          @for(btn of actionButtons; track $index) {
          <app-icon-button
            [icon]="btn.icon"
            (action)="btn.action(role)"
            [severity]="btn.severity"
            [tooltipPosition]="'top'"
            [tooltip]="btn.tooltip"
          />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div class="card flex justify-content-center">
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="vm.page.first"
      [rows]="vm.page.size"
      [totalRecords]="vm.page.pageCount"
      [rowsPerPageOptions]="vm.rowsPerPage"
    ></p-paginator>
  </div>
  } @else {
  <p>No results.</p>
  }
  <div>
    @if(vm.loading) {
    <div class="card flex justify-center progress-spinner">
      <p-progress-spinner ariaLabel="loading" />
    </div>
    }
  </div>
</div>
}
